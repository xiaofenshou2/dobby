name: build-dobby

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git cmake make
          chmod +x build.sh || true
          sed -i 's/\r$//' build.sh || true

      - name: Build Dobby only
        run: ./build.sh

      - name: Upload libdobby.a
        uses: actions/upload-artifact@v4
        with:
          name: libdobby-arm64-v8a
          path: |
            libdobby.a
            libs/arm64-v8a/libdobby.a
            build/libs/arm64-v8a/libdobby.a
            Dobby/build/libs/arm64-v8a/libdobby.a
            dobby_build/libs/arm64-v8a/libdobby.a
            dobby_build/*.a
            *.a
